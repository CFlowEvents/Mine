
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anniversary Date</title>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600&family=Roboto:wght@300;400&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            color: #fff;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('images/valentine/14.jpg') no-repeat center center fixed;
            background-size: cover;
            z-index: -3;
        }

        .background::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(5px);
            background: linear-gradient(
                rgba(0, 0, 0, 0.35),
                rgba(0, 0, 0, 0.18)
            );
            z-index: -2;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 560px;
            padding: 42px 36px;
            background: rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 28px;
            box-shadow: 0 22px 55px rgba(0, 0, 0, 0.45);
            color: #fff;
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
            animation: fadeIn 1.8s ease forwards;
        }

        .container::before {
            content: "";
            display: block;
            width: 90px;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                #d4af37,
                transparent
            );
            margin: 0 auto 25px auto;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            font-weight: 400;
            line-height: 1.15;
            color: #f4e7c5;
            margin: 0 0 30px 0;
            text-shadow: 0 4px 28px rgba(0, 0, 0, 0.85);
        }

        label {
            display: block;
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: #fff7df;
            margin-bottom: 18px;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.75);
        }

        input {
            width: 85%;
            max-width: 320px;
            padding: 15px 18px;
            font-size: 1.05rem;
            font-family: 'Playfair Display', serif;
            letter-spacing: 1px;
            border-radius: 18px;
            border: 1px solid rgba(212, 175, 55, 0.45);
            outline: none;
            background: rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(8px);
            color: #f4e7c5;
            text-align: center;
            transition: all 0.35s ease;
            box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.25);
        }

        input:focus {
            background: rgba(0, 0, 0, 0.38);
            border-color: #d4af37;
            box-shadow: 0 0 22px rgba(212, 175, 55, 0.25);
        }

        input::-webkit-calendar-picker-indicator {
            filter: invert(1) sepia(1) saturate(2) hue-rotate(10deg);
            cursor: pointer;
        }

        #error,
        #success {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            margin-top: 18px;
            padding: 12px 16px;
            border-radius: 16px;
            width: 80%;
            display: inline-block;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            letter-spacing: 0.5px;
        }

        #error {
            color: #fff;
            background: rgba(115, 20, 20, 0.72);
            border: 1px solid rgba(255, 190, 190, 0.35);
        }

        #success {
            color: #fff7df;
            background: rgba(38, 95, 55, 0.72);
            border: 1px solid rgba(212, 175, 55, 0.35);
        }

        .container.fade-out {
            opacity: 0;
            transform: translateY(-20px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .container {
                width: 82%;
                padding: 34px 24px;
                border-radius: 24px;
            }

            h1 {
                font-size: 3.2rem;
            }

            label {
                font-size: 1rem;
            }

            input {
                width: 90%;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="background"></div>

    <div class="container" id="container">
     

        <label for="anniversary">Enter the date our story began</label>

        <input type="date" id="anniversary" name="anniversary">

        <p id="error">That’s not the right date. Try again, my love.</p>

        <p id="success">Correct. Welcome to our story...</p>
    </div>

    <script>
        document.getElementById("anniversary").addEventListener("change", function() {
            const anniversary = this.value;
            const correctDate = "2024-06-08";

            const error = document.getElementById("error");
            const success = document.getElementById("success");
            const container = document.getElementById("container");

            if (anniversary === correctDate) {
                localStorage.setItem("anniversaryVerified", "true");

                error.style.opacity = 0;
                success.style.opacity = 1;

                setTimeout(() => {
                    container.classList.add("fade-out");
                }, 2500);

                setTimeout(() => {
                    window.location.href = "menu.html";
                }, 4300);
            } else {
                success.style.opacity = 0;
                error.style.opacity = 1;
            }
        });
    </script>
</body>
</html>
